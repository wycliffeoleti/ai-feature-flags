[project]
name = "ai-feature-flags"
version = "0.1.0"
description = "Feature flag platform for AI features: gradual rollout with continuous quality monitoring and automatic rollback."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "psycopg[binary]>=3.1,<4",
    "redis>=5.0,<6",
    "scipy>=1.11,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.31,<2"]

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiflags"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
